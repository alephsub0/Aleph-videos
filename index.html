
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Videos educativos y de divulgación matemática del Proyecto Alephsub0.">

    <title>Aleph Videos | Alephsub0</title>

    <style>
        :root {
            --bg: #0b1020;
            --surface: #151d30;
            --border: #293449;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system,
                         BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            padding: 55px 20px 35px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: -1px;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--muted);
            max-width: 600px;
            margin: 12px auto;
        }

        nav {
            margin-top: 25px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        nav a {
            margin: 0 12px;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
            min-height: 55vh;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .toolbar h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        #buscar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 12px 16px;
            width: 280px;
            max-width: 100%;
            font-size: 0.95rem;
        }

        #buscar:focus {
            outline: 1px solid var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            object-fit: contain;
        }

        .card-content {
            padding: 20px;
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 1.1rem;
        }

        .description {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0 0 15px;
        }

        .date {
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .actions a {
            font-size: 0.9rem;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        footer {
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 25px 20px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            #buscar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Aleph<span>Videos</span></h1>

    <p>
        Videos educativos y de divulgación matemática
        del Proyecto Alephsub0.
    </p>

    <nav>
        <a href="https://www.alephsub0.org/" target="_blank" rel="noopener noreferrer">
            Alephsub0
        </a>

        <a href="https://github.com/alephsub0/Aleph-videos"
           target="_blank" rel="noopener noreferrer">
            GitHub
        </a>
    </nav>
</header>

<main>

    <div class="toolbar">
        <h2>Galería de videos</h2>

        <input
            type="search"
            id="buscar"
            placeholder="Buscar videos..."
            aria-label="Buscar videos"
        >
    </div>

    <section id="galeria" class="grid" aria-live="polite">
        <p class="empty">Cargando videos...</p>
    </section>

</main>

<footer>
    <p>
        © <span id="year"></span>
        Alephsub0 · Proyecto de divulgación matemática
    </p>
</footer>

<script>
    const galeria = document.getElementById("galeria");
    const buscar = document.getElementById("buscar");

    let videos = [];

    document.getElementById("year").textContent =
        new Date().getFullYear();

    function crearTarjeta(video) {
        const card = document.createElement("article");
        card.className = "card";

        const player = document.createElement("video");
        player.controls = true;
        player.preload = "metadata";
        player.playsInline = true;

        const source = document.createElement("source");
        source.src = video.archivo;
        source.type = "video/mp4";

        player.appendChild(source);

        const content = document.createElement("div");
        content.className = "card-content";

        const titulo = document.createElement("h3");
        titulo.textContent = video.titulo;

        const descripcion = document.createElement("p");
        descripcion.className = "description";
        descripcion.textContent = video.descripcion || "";

        const fecha = document.createElement("p");
        fecha.className = "date";
        fecha.textContent = video.fecha || "";

        const actions = document.createElement("div");
        actions.className = "actions";

        const compartir = document.createElement("a");
        compartir.href = video.archivo;
        compartir.target = "_blank";
        compartir.rel = "noopener noreferrer";
        compartir.textContent = "Abrir video";

        const descargar = document.createElement("a");
        descargar.href = video.archivo;
        descargar.download = "";
        descargar.textContent = "Descargar MP4";

        actions.append(compartir, descargar);

        content.append(
            titulo,
            descripcion,
            fecha,
            actions
        );

        card.append(player, content);

        return card;
    }

    function mostrarVideos(filtro = "") {
        galeria.replaceChildren();

        const resultado = videos.filter(video =>
            video.titulo.toLowerCase().includes(
                filtro.toLowerCase()
            )
        );

        if (resultado.length === 0) {
            const mensaje = document.createElement("p");
            mensaje.className = "empty";
            mensaje.textContent =
                "No se encontraron videos.";

            galeria.appendChild(mensaje);
            return;
        }

        resultado.forEach(video => {
            galeria.appendChild(crearTarjeta(video));
        });
    }

    async function cargarVideos() {
        try {
            const respuesta = await fetch(
                "./videos.json",
                { cache: "no-store" }
            );

            if (!respuesta.ok) {
                throw new Error(
                    "No se pudo cargar videos.json"
                );
            }

            const datos = await respuesta.json();

            if (!Array.isArray(datos)) {
                throw new Error("Formato JSON incorrecto");
            }

            videos = datos;

            videos.sort((a, b) =>
                (b.fecha || "").localeCompare(a.fecha || "")
            );

            mostrarVideos();

        } catch (error) {
            console.error(error);

            galeria.replaceChildren();

            const mensaje = document.createElement("p");
            mensaje.className = "empty";
            mensaje.textContent =
                "No se pudo cargar la galería de videos.";

            galeria.appendChild(mensaje);
        }
    }

    buscar.addEventListener("input", event => {
        mostrarVideos(event.target.value);
    });

    cargarVideos();
</script>

</body>
</html>
